[package]
name = "audren-example-shielded-transfer"
version = "1.3.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
audren-client = { git = "https://github.com/audren-xyz/audren.git", branch = "main" }
base64 = "0.22.1"
rand = "0.8.5"
serde_json = "1"
solana-address = { version = "~2.7.0", features = ["curve25519", "std"] }
solana-instruction = "3.5.0"
solana-keypair = "3.1.2"
solana-message = "4.5.0"
solana-signer = "3.0.1"
solana-transaction = { version = "5.0.0", features = ["serde", "wincode"] }
wincode = "0.6"
