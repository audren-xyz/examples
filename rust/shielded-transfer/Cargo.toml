[package]
name = "audren-example-shielded-transfer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
audren-client = { git = "https://github.com/audren-xyz/audren.git", rev = "e14c37a97df7a5aaa46d28798c722640a1077254" }
audren-core = { git = "https://github.com/audren-xyz/audren.git", rev = "e14c37a97df7a5aaa46d28798c722640a1077254" }
base64 = "0.22"
bs58 = "0.5"
rand = "0.8.5"
serde_json = "1"
solana-address = { version = "~2.7.0", features = ["curve25519"] }
solana-instruction = "3.5.0"
solana-keypair = "3.1.2"
solana-message = "4.5.0"
solana-signer = "3.0.1"
solana-transaction = { version = "4.2.0", features = ["serde", "wincode"] }
wincode = "0.6"
