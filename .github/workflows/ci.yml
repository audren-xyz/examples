name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rust-ts-kotlin-parity:
    name: Rust, TypeScript (WASM) & Kotlin Examples (+ Cross-SDK Parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: examples
      - uses: actions/checkout@v7
        with:
          repository: audren-xyz/audren
          path: audren
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/rust -> target
            audren -> target
      - name: Check & run Rust examples (quickstart, institutional-audit, shielded-transfer)
        env:
          AUDREN_REPO_DIR: ${{ github.workspace }}/audren
        run: |
          set -euo pipefail
          cargo clippy --manifest-path examples/rust/Cargo.toml --all-targets -- -D warnings
          cargo run --release --quiet --manifest-path examples/rust/Cargo.toml -p audren-example-quickstart | tee /tmp/out-rust.txt
          cargo run --quiet --manifest-path examples/rust/Cargo.toml -p audren-example-institutional-audit
          cargo run --quiet --manifest-path examples/rust/Cargo.toml -p audren-example-shielded-transfer
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build @audren/sdk and run TypeScript examples (including WASM Groth16 prover)
        env:
          AUDREN_REPO_DIR: ${{ github.workspace }}/audren
        run: |
          set -euo pipefail
          pnpm --dir audren/packages/sdk install --frozen-lockfile
          pnpm --dir audren/packages/sdk build
          pnpm --dir examples/typescript install
          pnpm --dir examples/typescript --silent quickstart | tee /tmp/out-ts.txt
          pnpm --dir examples/typescript swap-plan
          pnpm --dir examples/typescript kamino-defi
          node --check examples/typescript/dataslice-scanner/index.mjs
      - name: Build native libaudren_ffi.so for Kotlin quickstart
        working-directory: audren
        run: cargo build -p audren-ffi --release
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: Run Kotlin (Android/JVM) quickstart
        working-directory: examples/kotlin/quickstart
        env:
          AUDREN_REPO_DIR: ${{ github.workspace }}/audren
        run: |
          set -euo pipefail
          gradle -q run --no-daemon | tee /tmp/out-kotlin.txt
      - name: Enforce byte-for-byte canonical parity across Rust, TypeScript & Kotlin
        run: |
          set -euo pipefail
          diff -u /tmp/out-rust.txt /tmp/out-ts.txt
          diff -u /tmp/out-rust.txt /tmp/out-kotlin.txt
          echo "100% byte-for-byte canonical stdout parity verified: Rust == TypeScript == Kotlin"

  swift-parity:
    name: Swift (iOS/macOS) Example (+ Rust Parity)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: examples
      - uses: actions/checkout@v7
        with:
          repository: audren-xyz/audren
          path: audren
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/rust -> target
            audren -> target
      - name: Build native libaudren_ffi.dylib and verify Swift == Rust parity
        env:
          AUDREN_REPO_DIR: ${{ github.workspace }}/audren
        run: |
          set -euo pipefail
          (cd audren && cargo build -p audren-ffi --release)
          cargo run --release --quiet --manifest-path examples/rust/Cargo.toml -p audren-example-quickstart | tee /tmp/out-rust.txt
          (cd examples/swift/quickstart && swift run -q 2>/dev/null || swift run) > /tmp/out-swift-raw.txt
          sed -n '/^\[1\/6 KEYS\]/,$p' /tmp/out-swift-raw.txt | tee /tmp/out-swift.txt
          diff -u /tmp/out-rust.txt /tmp/out-swift.txt
          echo "100% byte-for-byte canonical stdout parity verified: Rust == Swift"
